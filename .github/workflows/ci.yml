name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 23.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Install browsers for the editor tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run verification test suite
        run: |
          npx tsx scripts/verify/qr-verify.ts
          npx tsx scripts/verify/font-detect.ts
          npx tsx scripts/verify/core-integration.ts
          npx tsx scripts/verify/public-pages.ts
          npx tsx scripts/verify/editor.ts
          npx tsx scripts/verify/mail.ts
          npx tsx scripts/verify/tickets.ts --case submit
          npx tsx scripts/verify/tickets.ts --case inbox
          npx tsx scripts/verify/tickets.ts --case reissue
          npx tsx scripts/verify/tickets.ts --case notify
